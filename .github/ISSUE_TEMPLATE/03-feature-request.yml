name: 功能或文档建议
description: 提议新的工作流、模板、验证方式或文档改进
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题
      description: 谁遇到了什么问题？当前做法哪里不够？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、文档或接口。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据或示例
      description: 可附上论文案例、命令、日志或使用场景。
  - type: textarea
    id: scope
    attributes:
      label: 范围和限制
      description: 说明不应改变的行为、兼容性要求或验证标准。
